plugins {
    id 'com.android.application'
}

android {
    namespace 'app.flimmer.tv'
    compileSdk 35

    defaultConfig {
        applicationId "app.flimmer.tv"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Mit dem Standard-Schlüssel signiert, damit die APK direkt installierbar ist
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Nötig für die Video-Bibliothek (java.time / java.nio auf Android)
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/*.kotlin_module', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.4'

    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'

    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
